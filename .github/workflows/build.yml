          cat > app/src/main/java/ai/venice/questackill/ZipIo.kt <<'EOF_H'
          package ai.venice.questackill

          import java.io.Closeable
          import java.io.File
          import java.io.IOException
          import java.io.InputStream
          import java.io.RandomAccessFile
          import java.nio.charset.StandardCharsets
          import java.util.zip.CRC32
          import java.util.zip.Deflater
          import java.util.zip.Inflater
          import java.util.zip.InflaterInputStream

          data class ZipEntryInfo(
              val name: String, val method: Int, val crc: Long,
              val compSize: Long, val uncompSize: Long, val flags: Int, val localHeaderOffset: Long
          )

          internal fun u16(b: ByteArray, o: Int) = (b[o].toInt() and 0xFF) or ((b[o + 1].toInt() and 0xFF) shl 8)
          internal fun u32(b: ByteArray, o: Int) = u16(b, o).toLong() or (u16(b, o + 2).toLong() shl 16)
          internal fun u64(b: ByteArray, o: Int) = u32(b, o) or (u32(b, o + 4) shl 32)

          private class BoundedStream(private val raf: RandomAccessFile, private var remaining: Long) : InputStream() {
              override fun read(): Int {
                  if (remaining <= 0) return -1
                  remaining--
                  return raf.read()
              }
              override fun read(b: ByteArray, off: Int, len: Int): Int {
                  if (remaining <= 0) return -1
                  val n = raf.read(b, off, minOf(len.toLong(), remaining).toInt())
                  if (n > 0) remaining -= n
                  return n
              }
          }

          class ZipReader(file: File) : Closeable {
              private val raf = RandomAccessFile(file, "r")
              val entries: List<ZipEntryInfo> = readCd()

              private fun readCd(): List<ZipEntryInfo> {
                  val len = raf.length()
                  if (len < 22) throw IOException("Not a zip")
                  val scanLen = minOf(len, 66_022L).toInt()
                  val buf = ByteArray(scanLen)
                  raf.seek(len - scanLen)
                  raf.readFully(buf)
                  var eocd = -1
                  for (i in scanLen - 22 downTo 0) if (u32(buf, i) == 0x06054b50L) { eocd = i; break }
                  if (eocd < 0) throw IOException("No EOCD")
                  val eocdAbs = len - scanLen + eocd
                  var count = u16(buf, eocd + 10).toLong()
                  var cdOff = u32(buf, eocd + 16)
                  if (count == 0xFFFFL || cdOff == 0xFFFFFFFFL) {
                      val loc = ByteArray(20)
                      raf.seek(eocdAbs - 20)
                      raf.readFully(loc)
                      if (u32(loc, 0) != 0x07064b50L) throw IOException("No zip64 loc")
                      raf.seek(u64(loc, 8))
                      val h = ByteArray(56)
                      raf.readFully(h)
                      count = u64(h, 32)
                      cdOff = u64(h, 48)
                  }
                  val out = ArrayList<ZipEntryInfo>(count.toInt())
                  var p = cdOff
                  repeat(count.toInt()) {
                      val h = ByteArray(46)
                      raf.seek(p)
                      raf.readFully(h)
                      if (u32(h, 0) != 0x02014b50L) throw IOException("Bad CD")
                      val flags = u16(h, 8)
                      val method = u16(h, 10)
                      val crc = u32(h, 16)
                      var comp = u32(h, 20)
                      var uncomp = u32(h, 24)
                      val nameLen = u16(h, 28)
                      val extraLen = u16(h, 30)
                      val commentLen = u16(h, 32)
                      var localOff = u32(h, 42)
                      val nb = ByteArray(nameLen)
                      raf.seek(p + 46L)
                      raf.readFully(nb)
                      val name = String(nb, StandardCharsets.UTF_8)
                      if (comp == 0xFFFFFFFFL || uncomp == 0xFFFFFFFFL || localOff == 0xFFFFFFFFL) {
                          val ex = ByteArray(extraLen)
                          raf.seek(p + 46L + nameLen)
                          raf.readFully(ex)
                          var q = 0
                          while (q + 4 <= ex.size) {
                              val id = u16(ex, q)
                              val sz = u16(ex, q + 2)
                              if (id == 1) {
                                  var r = q + 4
                                  if (uncomp == 0xFFFFFFFFL && r + 8 <= ex.size) { uncomp = u64(ex, r); r += 8 }
                                  if (comp == 0xFFFFFFFFL && r + 8 <= ex.size) { comp = u64(ex, r); r += 8 }
                                  if (localOff == 0xFFFFFFFFL && r + 8 <= ex.size) { localOff = u64(ex, r); r += 8 }
                              }
                              q += 4 + sz
                          }
                      }
                      out.add(ZipEntryInfo(name, method, crc, comp, uncomp, flags, localOff))
                      p += 46L + nameLen + extraLen + commentLen
                  }
                  return out
              }

              private fun dataOff(e: ZipEntryInfo): Long {
                  raf.seek(e.localHeaderOffset)
                  val h = ByteArray(30)
                  raf.readFully(h)
                  if (u32(h, 0) != 0x04034b50L) throw IOException("Bad local header")
                  return e.localHeaderOffset + 30L + u16(h, 26) + u16(h, 28)
              }

              fun openData(e: ZipEntryInfo): InputStream {
                  raf.seek(dataOff(e))
                  val raw = BoundedStream(raf, e.compSize)
                  return if (e.method == 0) raw else InflaterInputStream(raw, Inflater(true), 1 shl 16)
              }

              fun readAll(e: ZipEntryInfo): ByteArray {
                  val out = java.io.ByteArrayOutputStream(e.uncompSize.toInt().coerceAtLeast(1024))
                  openData(e).use { it.copyTo(out, 1 shl 16) }
                  return out.toByteArray()
              }

              override fun close() = raf.close()
          }

          class ZipWriter(file: File) : Closeable {
              private class Cd(val name: ByteArray, val method: Int, val crc: Long, val comp: Long, val uncomp: Long, val flags: Int, val offset: Long)
              private val raf = RandomAccessFile(file, "rw")
              private val cd = ArrayList<Cd>()
              private var pos = 0L
              private var closed = false

              init { raf.setLength(0) }

              private fun w16(v: Int) { raf.write(v and 0xFF); raf.write((v ushr 8) and 0xFF) }
              private fun w32(v: Long) {
                  raf.write((v and 0xFF).toInt()); raf.write(((v ushr 8) and 0xFF).toInt())
                  raf.write(((v ushr 16) and 0xFF).toInt()); raf.write(((v ushr 24) and 0xFF).toInt())
              }
              private fun pad(base: Long, align: Int): ByteArray {
                  val n = ((align - ((base + 6) % align)) % align).toInt()
                  val b = ByteArray(6 + n)
                  b[0] = 0x35; b[1] = 0xD9.toByte(); b[2] = 0x02; b[3] = 0x00
                  b[4] = (align and 0xFF).toByte(); b[5] = ((align ushr 8) and 0xFF).toByte()
                  return b
              }

              inner class EntryWriter(name: String, private val method: Int, align: Int, private val knownCrc: Long = -1L) {
                  private val nb = name.toByteArray(StandardCharsets.UTF_8)
                  private val crc = CRC32()
                  private val off: Long
                  private val crcPos: Long
                  private val sizePos: Long
                  private var comp = 0L
                  private var uncomp = 0L
                  private val def: Deflater? = if (method == 8) Deflater(Deflater.DEFAULT_COMPRESSION, true) else null
                  private val buf = ByteArray(1 shl 16)
                  private var done = false

                  init {
                      off = pos
                      val base = off + 30L + nb.size
                      val extra = if (align > 1) pad(base, align) else ByteArray(0)
                      w32(0x04034b50L); w16(20); w16(0x0800); w16(method); w16(0); w16(0x21)
                      crcPos = raf.filePointer
                      w32(if (knownCrc >= 0) knownCrc else 0L)
                      sizePos = raf.filePointer
                      w32(0L); w32(0L)
                      w16(nb.size); w16(extra.size)
                      raf.write(nb)
                      if (extra.isNotEmpty()) raf.write(extra)
                      pos = raf.filePointer
                  }

                  fun write(b: ByteArray, o: Int = 0, l: Int = b.size) {
                      if (knownCrc < 0) crc.update(b, o, l)
                      uncomp += l
                      val d = def
                      if (d == null) { raf.write(b, o, l); comp += l }
                      else {
                          d.setInput(b, o, l)
                          while (!d.needsInput()) {
                              val n = d.deflate(buf)
                              if (n <= 0) break
                              raf.write(buf, 0, n)
                              comp += n
                          }
                      }
                  }

                  fun finish() {
                      if (done) return
                      done = true
                      val d = def
                      if (d != null) {
                          d.finish()
                          while (!d.finished()) {
                              val n = d.deflate(buf)
                              if (n <= 0) break
                              raf.write(buf, 0, n)
                              comp += n
                          }
                          d.end()
                      }
                      val end = raf.filePointer
                      val cv = if (knownCrc >= 0) knownCrc else crc.value
                      raf.seek(crcPos); w32(cv)
                      raf.seek(sizePos); w32(comp); w32(uncomp)
                      raf.seek(end)
                      pos = end
                      cd.add(Cd(nb, method, cv, comp, uncomp, 0x0800, off))
                  }
              }

              fun entry(name: String, method: Int, align: Int = 1, knownCrc: Long = -1L) = EntryWriter(name, method, align, knownCrc)

              override fun close() {
                  if (closed) return
                  closed = true
                  val cdStart = raf.filePointer
                  for (r in cd) {
                      w32(0x02014b50L); w16(20); w16(20); w16(r.flags); w16(r.method); w16(0); w16(0x21)
                      w32(r.crc); w32(r.comp); w32(r.uncomp)
                      w16(r.name.size); w16(0); w16(0); w16(0); w16(0); w32(0L); w32(r.offset)
                      raf.write(r.name)
                  }
                  val cdSize = raf.filePointer - cdStart
                  val count = cd.size.toLong()
                  w32(0x06054b50L); w16(0); w16(0)
                  w16(count.toInt()); w16(count.toInt())
                  w32(cdSize); w32(cdStart); w16(0)
                  raf.close()
              }
          }
          EOF_H

          cat > app/src/main/java/ai/venice/questackill/Axm.kt <<'EOF_I'
          package ai.venice.questackill

          import java.nio.charset.StandardCharsets

          object Axm {
              data class Info(val packageName: String?, val minSdk: Int, val targetSdk: Int)

              private class Pool(private val d: ByteArray, private val s: Int) {
                  val count = u32(d, s + 8).toInt()
                  private val flags = u32(d, s + 16).toInt()
                  private val start = u32(d, s + 20).toInt()
                  private val utf8 = (flags and 0x100) != 0
                  fun get(i: Int): String {
                      if (i < 0 || i >= count) return ""
                      val off = start + u32(d, s + 28 + i * 4).toInt()
                      return if (utf8) {
                          var p = off
                          p += if ((d[p].toInt() and 0x80) != 0) 2 else 1
                          val n = d[p].toInt() and 0xFF
                          p++
                          String(d, p, n, StandardCharsets.UTF_8)
                      } else {
                          var p = off
                          var n = u16(d, p); p += 2
                          if ((n and 0x8000) != 0) { n = ((n and 0x7FFF) shl 16) or u16(d, p); p += 2 }
                          String(d, p, n * 2, StandardCharsets.UTF_16LE)
                      }
                  }
              }

              fun parse(a: ByteArray): Info {
                  var pkg: String? = null
                  var minSdk = 0
                  var targetSdk = 0
                  if (a.size < 8 || u16(a, 0) != 0x0003) return Info(null, 0, 0)
                  var off = u16(a, 2)
                  var pool: Pool? = null
                  while (off + 8 <= a.size) {
                      val type = u16(a, off)
                      val hsz = u16(a, off + 2)
                      val sz = u32(a, off + 4).toInt()
                      if (sz <= 0) break
                      if (type == 0x0001) pool = Pool(a, off)
                      else if (type == 0x0102 && pool != null) {
                          val ext = off + hsz
                          val as0 = u16(a, ext + 8)
                          val asz = u16(a, ext + 10)
                          val ac = u16(a, ext + 12)
                          var p = ext + as0
                          repeat(ac) {
                              val ni = u32(a, p + 4).toInt()
                              val dt = a[p + 15].toInt() and 0xFF
                              val v = u32(a, p + 16).toInt()
                              when (pool.get(ni)) {
                                  "package" -> if (dt == 0x03) pkg = pool.get(v)
                                  "minSdkVersion" -> if (dt == 0x10) minSdk = v
                                  "targetSdkVersion" -> if (dt == 0x10) targetSdk = v
                              }
                              p += asz
                          }
                      }
                      off += sz
                  }
                  return Info(pkg, minSdk, targetSdk)
              }
          }
          EOF_I

          cat > app/src/main/java/ai/venice/questackill/DexPatch.kt <<'EOF_J'
          package ai.venice.questackill

          import java.security.MessageDigest
          import java.util.zip.Adler32

          object DexPatch {
              fun replaceAll(dex: ByteArray, pairs: List<Pair<ByteArray, ByteArray>>): Int {
                  var hits = 0
                  for (pair in pairs) {
                      val old = pair.first
                      val new = pair.second
                      if (old.size != new.size || old.isEmpty()) continue
                      var i = 0
                      while (i <= dex.size - old.size) {
                          val idx = find(dex, old, i)
                          if (idx < 0) break
                          System.arraycopy(new, 0, dex, idx, new.size)
                          hits++
                          i = idx + new.size
                      }
                  }
                  if (hits > 0) fix(dex)
                  return hits
              }

              private fun find(hay: ByteArray, needle: ByteArray, from: Int): Int {
                  val f = needle[0]
                  val last = hay.size - needle.size
                  var i = from
                  while (i <= last) {
                      if (hay[i] == f) {
                          var j = 1
                          while (j < needle.size && hay[i + j] == needle[j]) j++
                          if (j == needle.size) return i
                      }
                      i++
                  }
                  return -1
              }

              private fun fix(dex: ByteArray) {
                  if (dex.size < 32) return
                  val sha = MessageDigest.getInstance("SHA-1").digest(dex.copyOfRange(32, dex.size))
                  System.arraycopy(sha, 0, dex, 12, 20)
                  val ad = Adler32()
                  ad.update(dex, 12, dex.size - 12)
                  val v = ad.value
                  dex[8] = (v and 0xFF).toByte()
                  dex[9] = ((v ushr 8) and 0xFF).toByte()
                  dex[10] = ((v ushr 16) and 0xFF).toByte()
                  dex[11] = ((v ushr 24) and 0xFF).toByte()
              }
          }
          EOF_J

          cat > app/src/main/java/ai/venice/questackill/SigningKey.kt <<'EOF_K'
          package ai.venice.questackill

          import android.content.Context
          import org.bouncycastle.asn1.x500.X500Name
          import org.bouncycastle.cert.jcajce.JcaX509CertificateConverter
          import org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder
          import org.bouncycastle.operator.jcajce.JcaContentSignerBuilder
          import java.io.File
          import java.math.BigInteger
          import java.security.KeyPairGenerator
          import java.security.KeyStore
          import java.security.PrivateKey
          import java.security.cert.X509Certificate
          import java.util.Date

          object SigningKey {
              private const val ALIAS = "ackill"
              private const val PASS = "ackill-pass"
              data class Material(val key: PrivateKey, val cert: X509Certificate)

              @Synchronized
              fun get(ctx: Context): Material {
                  val f = File(ctx.filesDir, "signing.p12")
                  if (f.exists()) runCatching { return load(f) }
                  val fresh = generate()
                  runCatching { save(f, fresh) }
                  return fresh
              }

              private fun load(f: File): Material {
                  val ks = KeyStore.getInstance("PKCS12")
                  f.inputStream().use { ks.load(it, PASS.toCharArray()) }
                  return Material(ks.getKey(ALIAS, PASS.toCharArray()) as PrivateKey, ks.getCertificate(ALIAS) as X509Certificate)
              }

              private fun save(f: File, m: Material) {
                  val ks = KeyStore.getInstance("PKCS12")
                  ks.load(null, null)
                  ks.setKeyEntry(ALIAS, m.key, PASS.toCharArray(), arrayOf(m.cert))
                  f.outputStream().use { ks.store(it, PASS.toCharArray()) }
              }

              private fun generate(): Material {
                  val g = KeyPairGenerator.getInstance("RSA")
                  g.initialize(2048)
                  val kp = g.generateKeyPair()
                  val sub = X500Name("CN=QuestACKill, O=Venice, C=US")
                  val now = Date()
                  val b = JcaX509v3CertificateBuilder(sub, BigInteger.valueOf(System.currentTimeMillis()), now, Date(now.time + 946080000000L), sub, kp.public)
                  val s = JcaContentSignerBuilder("SHA256withRSA").build(kp.private)
                  return Material(kp.private, JcaX509CertificateConverter().getCertificate(b.build(s)))
              }
          }
          EOF_K

          cat > app/src/main/java/ai/venice/questackill/Scan.kt <<'EOF_L'
          package ai.venice.questackill

          import java.io.File
          import java.util.zip.ZipFile

          enum class Severity { HIGH, MEDIUM, LOW }
          enum class Action { KEEP, REMOVE, BYPASS }

          data class Finding(
              val id: String, val label: String, val severity: Severity,
              val evidence: List<String>, val removableEntries: List<String>,
              val bypassable: Boolean, var action: Action = Action.BYPASS
          )

          data class ApkInfo(
              val packageName: String, val minSdk: Int, val targetSdk: Int,
              val certDer: ByteArray?, val entryCount: Int, val findings: List<Finding>
          )

          object Scanner {
              private class Rule(val id: String, val label: String, val sev: Severity, val libs: List<String>, val toks: List<String>, val assets: List<String>)

              private val RULES = listOf(
                  Rule("eos", "Epic Online Services anti-cheat", Severity.HIGH, listOf("libEOSSDK", "libeossdk"), listOf("com/epicgames/eos"), listOf("assets/eossdk", "assets/EOSSDK")),
                  Rule("battleye", "BattlEye", Severity.HIGH, listOf("libBEService", "libBEClient", "libBattlEye"), listOf("com/battleye"), listOf("BattlEye/")),
                  Rule("eac", "Easy Anti-Cheat", Severity.HIGH, listOf("libEasyAntiCheat", "libeasyanticheat"), listOf("com/epicgames/eac"), emptyList()),
                  Rule("integrity", "Play Integrity / SafetyNet", Severity.MEDIUM, emptyList(), listOf("safetynet/SafetyNetClient", "integrity/IntegrityManager"), emptyList()),
                  Rule("sigcheck", "Signature verification", Severity.MEDIUM, emptyList(), listOf("GET_SIGNATURES", "GET_SIGNING_CERTIFICATES"), emptyList())
              )

              fun scan(apk: File): ApkInfo {
                  var manifest: Axm.Info? = null
                  var certDer: ByteArray? = null
                  val names = ArrayList<String>()
                  val rem = HashMap<String, MutableList<String>>()
                  val toks = HashMap<String, MutableList<String>>()

                  ZipFile(apk).use { zf ->
                      val all = zf.entries().toList()
                      for (e in all) {
                          names.add(e.name)
                          if (e.name == "AndroidManifest.xml") manifest = Axm.parse(zf.getInputStream(e).use { it.readBytes() })
                          if (certDer == null && e.name.startsWith("META-INF/") && (e.name.endsWith(".RSA", true) || e.name.endsWith(".DSA", true) || e.name.endsWith(".EC", true))) {
                              certDer = runCatching {
                                  java.security.cert.CertificateFactory.getInstance("X.509")
                                      .generateCertificates(zf.getInputStream(e).use { it.readBytes() }.inputStream()).first().encoded
                              }.getOrNull()
                          }
                          val base = e.name.substringAfterLast('/').substringBefore(".so")
                          for (r in RULES) {
                              if (r.libs.any { base.equals(it, true) }) rem.getOrPut(r.id) { ArrayList() }.add(e.name)
                              else if (r.assets.any { e.name.startsWith(it, true) }) rem.getOrPut(r.id) { ArrayList() }.add(e.name)
                          }
                      }
                      for (e in all) {
                          if (!e.name.matches(Regex("classes\\d*\\.dex"))) continue
                          if (e.size > 314572800L) continue
                          val text = String(zf.getInputStream(e).use { it.readBytes() }, Charsets.ISO_8859_1)
                          for (r in RULES) for (t in r.toks) if (text.contains(t)) toks.getOrPut(r.id) { ArrayList() }.add("dex: " + t)
                      }
                  }

                  val findings = RULES.mapNotNull { r ->
                      val a = rem[r.id].orEmpty()
                      val b = toks[r.id].orEmpty()
                      if (a.isEmpty() && b.isEmpty()) return@mapNotNull null
                      Finding(r.id, r.label, r.sev, (a + b).distinct().take(12), a.distinct(), true)
                  }

                  return ApkInfo(manifest?.packageName ?: "unknown", manifest?.minSdk ?: 0, manifest?.targetSdk ?: 0, certDer, names.size, findings)
              }
          }
