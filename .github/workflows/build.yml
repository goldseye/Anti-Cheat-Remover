name: release-apk
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p project
          cd project
          mkdir -p gradle/wrapper app/src/main/java/ai/venice/questackill app/src/main/res/values

          cat > settings.gradle.kts <<'EOF_A'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "QuestACKill"
          include(":app")
          EOF_A

          cat > build.gradle.kts <<'EOF_B'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_B

          cat > gradle.properties <<'EOF_C'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_C

          cat > app/build.gradle.kts <<'EOF_D'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "ai.venice.questackill"
              compileSdk = 34
              defaultConfig {
                  applicationId = "ai.venice.questackill"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              kotlinOptions { jvmTarget = "17" }
              packaging {
                  resources.excludes += setOf("META-INF/*.kotlin_module", "META-INF/versions/9/**", "META-INF/LICENSE*", "META-INF/NOTICE*")
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation(platform("androidx.compose:compose-bom:2024.09.02"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("com.android.tools.build:apksig:8.5.2")
              implementation("org.bouncycastle:bcpkix-jdk18on:1.78.1")
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          EOF_D

          cat > app/src/main/AndroidManifest.xml <<'EOF_E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application android:allowBackup="false" android:label="@string/app_name" android:largeHeap="true" android:theme="@style/T">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden" android:label="@string/app_name">
                      <intent-filter>
