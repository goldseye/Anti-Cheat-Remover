                  }
              }
          }

          @Composable
          fun Screen() {
              val ctx = LocalContext.current
              val vm: AppVm = viewModel { AppVm(ctx.applicationContext) }
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { u -> if (u != null) vm.scan(u, "input.apk") }
              val perms = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { }

              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Text("QUEST AC KILLER", fontWeight = FontWeight.Black, fontSize = 20.sp, color = Color(0xFF6EE7B7))
                  Text("Strip and re-sign anti-cheat from Quest APKs", fontSize = 11.sp, color = Color(0xFF7C8A99))
                  Spacer(Modifier.height(12.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(onClick = {
                          if (Build.VERSION.SDK_INT <= 28) perms.launch(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          picker.launch(arrayOf("*/*"))
                      }, enabled = vm.phase != Phase.WORKING && vm.phase != Phase.SCANNING) { Text("Select APK") }
                      OutlinedButton(onClick = {
                          if (Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) ctx.startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                      }) { Text("All-files access") }
                  }
                  vm.sourceName?.let { Spacer(Modifier.height(8.dp)); Text(it, fontSize = 12.sp, color = Color(0xFFB6C2CF)) }
                  vm.info?.let { Text(it.packageName + " - minSdk " + it.minSdk, fontSize = 11.sp, color = Color(0xFF7C8A99)) }
