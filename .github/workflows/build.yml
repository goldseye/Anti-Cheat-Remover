                  }
                  vm.info?.findings?.let { list ->
                      if (list.isNotEmpty()) {
                          Text("DETECTED", fontSize = 11.sp, fontWeight = FontWeight.Bold, color = Color(0xFF7C8A99))
                          LazyColumn(Modifier.weight(0.55f).fillMaxWidth()) { items(list) { f -> FindingRow(f) { vm.setAction(f, it) } } }
                      }
                  }
                  if (vm.logLines.isNotEmpty()) {
                      LazyColumn(Modifier.weight(0.45f).fillMaxWidth()) {
                          items(vm.logLines) { Text(it, fontFamily = FontFamily.Monospace, fontSize = 10.sp, color = Color(0xFF8FA0B0)) }
