          cat > app/src/main/java/ai/venice/questackill/Rebuilder.kt <<'EOF_M'
          package ai.venice.questackill

          import android.content.Context
          import com.android.apksig.ApkSigner
          import java.io.File
          import java.io.IOException
          import java.security.MessageDigest

          class Rebuilder(
              private val ctx: Context, private val src: File, private val info: ApkInfo,
              private val workDir: File, private val log: (String) -> Unit, private val progress: (Float, String) -> Unit
          ) {
              fun build(): File {
                  val drop = HashSet<String>()
                  var bypassSig = false
                  for (f in info.findings) {
                      when (f.action) {
                          Action.KEEP -> {}
                          Action.BYPASS -> { drop.addAll(f.removableEntries.filter { it.endsWith(".so") }); bypassSig = true }
                          Action.REMOVE -> { drop.addAll(f.removableEntries); bypassSig = true }
                      }
                  }

                  val unsigned = File(workDir, "unsigned.apk")
                  val signed = File(workDir, "signed.apk")
                  val material = SigningKey.get(ctx)
                  val pairs = buildPairs(material)

                  ZipReader(src).use { reader ->
                      ZipWriter(unsigned).use { writer ->
                          val total = reader.entries.size.toFloat()
                          var done = 0
                          for (e in reader.entries) {
                              done++
                              if (done % 40 == 0) progress(done / total * 0.75f, "Repacking " + done)
                              if (e.name.startsWith("META-INF/") && (e.name.endsWith(".SF", true) || e.name.endsWith(".RSA", true) || e.name.endsWith(".DSA", true) || e.name.endsWith(".EC", true))) continue
                              if (e.name in drop) continue
                              val force = e.name == "resources.arsc" || e.name.endsWith(".so")
                              if (e.name.matches(Regex("classes\\d*\\.dex")) && pairs.isNotEmpty() && bypassSig) {
                                  val bytes = reader.readAll(e)
                                  val hits = DexPatch.replaceAll(bytes, pairs)
                                  if (hits > 0) log("  patched " + e.name + ": " + hits)
                                  val w = writer.entry(e.name, 8, 1)
                                  w.write(bytes); w.finish()
                                  continue
                              }
                              val w = if (force) writer.entry(e.name, 0, 4096, e.crc) else writer.entry(e.name, e.method, 1, if (e.method == 0) e.crc else -1L)
                              reader.openData(e).use { s ->
                                  val buf = ByteArray(1 shl 16)
                                  while (true) {
                                      val n = s.read(buf)
                                      if (n <= 0) break
                                      w.write(buf, 0, n)
                                  }
                              }
                              w.finish()
                          }
                      }
                  }

                  progress(0.8f, "Signing")
                  ApkSigner.Builder(listOf(ApkSigner.SignerConfig("ackill", material.key, listOf(material.cert))))
                      .setInputApk(unsigned)
                      .setOutputApk(signed)
                      .setMinSdkVersion(if (info.minSdk > 0) info.minSdk else 24)
                      .setV1SigningEnabled(true)
                      .setV2SigningEnabled(true)
                      .setV3SigningEnabled(false)
                      .build()
                      .sign()

                  unsigned.delete()
                  if (!signed.exists() || signed.length() == 0L) throw IOException("No signing output")
                  progress(0.95f, "Signed")
                  return signed
              }

              private fun buildPairs(m: SigningKey.Material): List<Pair<ByteArray, ByteArray>> {
                  val oldDer = info.certDer ?: return emptyList()
                  val a = hashForms(oldDer)
                  val b = hashForms(m.cert.encoded)
                  return a.zip(b).filter { it.first.isNotEmpty() && it.first.length == it.second.length && it.first != it.second }
                      .map { it.first.toByteArray() to it.second.toByteArray() }
              }

              private fun hashForms(der: ByteArray): List<String> {
                  val out = ArrayList<String>()
                  for (alg in listOf("SHA-1", "SHA-256")) {
                      val h = MessageDigest.getInstance(alg).digest(der)
                      val hex = h.joinToString("") { "%02x".format(it) }
                      out.add(hex); out.add(hex.uppercase())
                      out.add(android.util.Base64.encodeToString(h, android.util.Base64.NO_WRAP))
                  }
                  return out
              }
          }
