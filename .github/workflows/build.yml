          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          enum class Phase { IDLE, SCANNING, READY, WORKING, DONE, ERROR }

          class AppVm(private val ctx: android.content.Context) : ViewModel() {
              var phase by mutableStateOf(Phase.IDLE)
              var sourceName by mutableStateOf<String?>(null)
              var info by mutableStateOf<ApkInfo?>(null)
              val logLines = mutableStateListOf<String>()
              var progress by mutableStateOf(0f)
              var stage by mutableStateOf("")
              var outputUri by mutableStateOf<Uri?>(null)
              var outputName by mutableStateOf<String?>(null)
              var error by mutableStateOf<String?>(null)
              private var src: File? = null

              fun log(s: String) {
                  if (logLines.size > 800) logLines.removeAt(0)
                  logLines.add(s)
              }

              fun scan(uri: Uri, name: String) {
                  phase = Phase.SCANNING
                  error = null
                  outputUri = null
                  outputName = null
                  logLines.clear()
                  viewModelScope.launch(Dispatchers.IO) {
                      try {
                          val dir = File(ctx.cacheDir, "work").apply { mkdirs() }
                          dir.listFiles()?.forEach { it.delete() }
                          val copy = File(dir, "input.apk")
                          ctx.contentResolver.openInputStream(uri)!!.use { i -> copy.outputStream().use { i.copyTo(it, 1 shl 16) } }
                          src = copy
                          sourceName = name
                          log("Loaded " + (copy.length() / 1048576) + " MB")
                          val sc = Scanner.scan(copy)
                          log("Package: " + sc.packageName)
                          if (sc.findings.isEmpty()) log("No known anti-cheat detected.")
                          info = sc
                          phase = Phase.READY
                      } catch (t: Throwable) {
                          error = t.message ?: t.toString()
                          phase = Phase.ERROR
                      }
                  }
              }

              fun setAction(f: Finding, a: Action) {
                  val c = info ?: return
                  info = c.copy(findings = c.findings.map { if (it.id == f.id) it.copy(action = a) else it })
              }

              fun run() {
                  val s = src ?: return
                  val i = info ?: return
                  phase = Phase.WORKING
                  progress = 0f
                  logLines.clear()
                  viewModelScope.launch(Dispatchers.IO) {
                      try {
                          val dir = File(ctx.cacheDir, "work").apply { mkdirs() }
                          val out = Rebuilder(ctx, s, i, dir, ::log) { p, st -> progress = p; stage = st }.build()
                          val stamp = SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())
                          val name = i.packageName.replace(Regex("[^A-Za-z0-9._-]"), "_") + "-acmod-" + stamp + ".apk"
                          outputUri = Output.write(ctx, out, name)
                          outputName = "Download/QuestAC/" + name
                          log("Saved " + name)
                          progress = 1f
                          stage = "Done"
                          phase = Phase.DONE
                      } catch (t: Throwable) {
                          error = t.message ?: t.toString()
                          log("FAILED: " + t.message)
                          phase = Phase.ERROR
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  setContent {
