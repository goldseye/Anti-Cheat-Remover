          package ai.venice.questackill

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.File

          object Output {
              fun write(ctx: Context, src: File, name: String): Uri {
                  if (Build.VERSION.SDK_INT >= 29) {
                      val v = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, name)
                          put(MediaStore.Downloads.MIME_TYPE, "application/vnd.android.package-archive")
                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/QuestAC")
                          put(MediaStore.Downloads.IS_PENDING, 1)
                      }
                      val r = ctx.contentResolver
                      val uri = r.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v) ?: error("No MediaStore entry")
                      r.openOutputStream(uri)!!.use { o -> src.inputStream().use { it.copyTo(o, 1 shl 16) } }
                      r.update(uri, ContentValues().apply { put(MediaStore.Downloads.IS_PENDING, 0) }, null, null)
                      return uri
                  }
                  @Suppress("DEPRECATION")
                  val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "QuestAC")
                  dir.mkdirs()
                  val t = File(dir, name)
                  src.inputStream().use { i -> t.outputStream().use { i.copyTo(it, 1 shl 16) } }
                  return Uri.fromFile(t)
              }
          }
          EOF_N

