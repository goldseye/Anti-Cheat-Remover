          package ai.venice.questackill

          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageInstaller
          import android.net.Uri
          import android.os.Build
          import android.widget.Toast

          class InstallReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val s = i.getIntExtra(PackageInstaller.EXTRA_STATUS, -1)
                  Toast.makeText(c, if (s == PackageInstaller.STATUS_SUCCESS) "Installed" else "Install failed", Toast.LENGTH_LONG).show()
              }
          }

          object Installer {
              fun install(ctx: Context, uri: Uri) {
                  runCatching {
                      val pi = ctx.packageManager.packageInstaller
                      val id = pi.createSession(PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL))
                      pi.openSession(id).use { s ->
                          ctx.contentResolver.openInputStream(uri)!!.use { ins ->
                              s.openWrite("base.apk", 0, -1).use { o -> ins.copyTo(o, 1 shl 16); s.fsync(o) }
                          }
                          val f = if (Build.VERSION.SDK_INT >= 31) PendingIntent.FLAG_MUTABLE else 0
                          s.commit(PendingIntent.getBroadcast(ctx, id, Intent(ctx, InstallReceiver::class.java), f or PendingIntent.FLAG_UPDATE_CURRENT).intentSender)
                      }
                  }.onFailure { Toast.makeText(ctx, "Install failed: " + it.message, Toast.LENGTH_LONG).show() }
              }
          }
          EOF_O

